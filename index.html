<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>時間割 - 機械科1年2組</title>
    
    <!-- PWA用のメタタグ -->
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    
    <!-- iOS用のアイコン（ダミー） -->
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192x192/38bdf8/ffffff?text=TimeTable">

    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --danger-color: #f87171;
            --success-color: #4ade80;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            padding-bottom: 40px;
            overflow-y: auto; /* スクロール可能に */
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Header & Toggle */
        .header {
            text-align: center;
            padding: 10px 0;
            position: relative;
        }
        .current-time {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 20px var(--accent-glow);
            margin-bottom: 5px;
        }
        .current-date {
            font-size: 1rem;
            color: var(--text-sub);
            margin-bottom: 15px;
        }

        /* 特12切り替えトグル */
        .toggle-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: var(--text-sub);
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .4s;
            border-radius: 34px;
            border: 1px solid var(--glass-border);
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--accent-color);
        }
        input:checked + .slider:before {
            transform: translateX(22px);
        }

        /* Card Styles */
        .card-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-sub);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-label::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-glow);
        }
        .card-label.next::before {
            background: #a78bfa;
            box-shadow: 0 0 10px rgba(167, 139, 250, 0.5);
        }

        .subject-name {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.2;
        }
        .teacher-name {
            font-size: 0.95rem;
            color: var(--text-sub);
            margin-bottom: 16px;
        }
        .time-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1rem;
            font-weight: 500;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .period-badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.9rem;
        }

        /* 全体スケジュールリスト */
        .schedule-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .schedule-list::-webkit-scrollbar {
            width: 6px;
        }
        .schedule-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
        .schedule-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        .schedule-item.current {
            background: rgba(56, 189, 248, 0.1);
            border-color: rgba(56, 189, 248, 0.3);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.1);
        }
        .schedule-item.current .item-subject {
            color: var(--accent-color);
        }
        .item-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .item-subject {
            font-weight: 600;
            font-size: 1.05rem;
        }
        .item-teacher {
            font-size: 0.8rem;
            color: var(--text-sub);
        }
        .item-right {
            text-align: right;
            font-size: 0.85rem;
            color: var(--text-sub);
        }
        .item-period {
            font-weight: 600;
            color: var(--text-main);
        }

        /* Animation Classes */
        .fade-out {
            opacity: 0;
            transform: translateY(10px);
        }
        .fade-in {
            opacity: 1;
            transform: translateY(0);
        }

        /* Notification Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 16px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
        .toast-title {
            font-size: 0.9rem;
            color: var(--accent-color);
            margin-bottom: 4px;
            font-weight: 600;
        }
        .toast-message {
            font-size: 1.1rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="toast" id="toast">
        <div class="toast-title">お知らせ</div>
        <div class="toast-message" id="toast-message">次の授業は〇〇です。</div>
    </div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="current-time" id="current-time">00:00</div>
            <div class="current-date" id="current-date">令和8年度 機械科1年2組</div>
            
            <!-- 特12切り替えトグル -->
            <div class="toggle-wrapper">
                <span>通常</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="schedule-toggle">
                    <span class="slider"></span>
                </label>
                <span>特12</span>
            </div>
        </div>

        <!-- Current Class Card -->
        <div class="glass-panel" id="current-card">
            <div class="card-label">現在の授業</div>
            <div id="current-content">
                <div class="subject-name" id="current-subject">--</div>
                <div class="teacher-name" id="current-teacher">--</div>
                <div class="time-info">
                    <span class="period-badge" id="current-period">--</span>
                    <span id="current-time-range">--:-- ~ --:--</span>
                </div>
            </div>
        </div>

        <!-- Next Class Card -->
        <div class="glass-panel" id="next-card">
            <div class="card-label next">次の授業</div>
            <div id="next-content">
                <div class="subject-name" id="next-subject">--</div>
                <div class="teacher-name" id="next-teacher">--</div>
                <div class="time-info">
                    <span class="period-badge" id="next-period">--</span>
                    <span id="next-time-range">--:-- ~ --:--</span>
                </div>
            </div>
        </div>

        <!-- 1日の全体スケジュール -->
        <div class="glass-panel">
            <div class="card-label">今日の時間割</div>
            <div class="schedule-list" id="schedule-list">
                <!-- JavaScriptで生成 -->
            </div>
        </div>
    </div>

    <script>
        // --- 通常時間割データ ---
        const normalScheduleData = {
            1: [ // 月曜日
                { p: 1, sub: "工業情報数理", tea: "藤井先生・前場先生", start: "09:50", end: "10:40" },
                { p: 2, sub: "数学I", tea: "遠藤先生", start: "10:50", end: "11:40" },
                { p: 3, sub: "音楽I", tea: "川久保先生", start: "11:50", end: "12:40" },
                { p: 4, sub: "音楽I", tea: "川久保先生", start: "12:50", end: "13:40" },
                { p: 5, sub: "総探", tea: "小川先生・佐々木先生", start: "13:25", end: "14:15" },
                { p: 6, sub: "LHR", tea: "小川先生・岩井先生", start: "14:25", end: "15:15" }
            ],
            2: [ // 火曜日
                { p: 1, sub: "工業技術基礎", tea: "早川先生・前場先生・吉垣先生", start: "09:50", end: "10:40" },
                { p: 2, sub: "工業技術基礎", tea: "早川先生・前場先生・吉垣先生", start: "10:50", end: "11:40" },
                { p: 3, sub: "工業技術基礎", tea: "早川先生・前場先生・吉垣先生", start: "11:50", end: "12:40" },
                { p: 4, sub: "機械工作", tea: "森田先生", start: "12:50", end: "13:40" },
                { p: 5, sub: "数学I", tea: "遠藤先生", start: "13:25", end: "14:15" },
                { p: 6, sub: "言語文化", tea: "小川先生", start: "14:25", end: "15:15" }
            ],
            3: [ // 水曜日
                { p: 1, sub: "地理総合", tea: "東先生", start: "09:50", end: "10:40" },
                { p: 2, sub: "体育", tea: "大崎先生", start: "10:50", end: "11:40" },
                { p: 3, sub: "生産技術", tea: "齊藤先生", start: "11:50", end: "12:40" },
                { p: 4, sub: "英語CI", tea: "向後先生", start: "12:50", end: "13:40" },
                { p: 5, sub: "機械工作", tea: "森田先生", start: "13:25", end: "14:15" },
                { p: 6, sub: "数学I", tea: "遠藤先生", start: "14:25", end: "15:15" }
            ],
            4: [ // 木曜日
                { p: 1, sub: "体育", tea: "大崎先生", start: "09:50", end: "10:40" },
                { p: 2, sub: "生産技術", tea: "齊藤先生", start: "10:50", end: "11:40" },
                { p: 3, sub: "英語CI", tea: "向後先生", start: "11:50", end: "12:40" },
                { p: 4, sub: "科学と人間生活", tea: "八木澤先生", start: "12:50", end: "13:40" },
                { p: 5, sub: "製図", tea: "岩井先生・藤井先生", start: "13:25", end: "14:15" },
                { p: 6, sub: "製図", tea: "岩井先生・藤井先生", start: "14:25", end: "15:15" }
            ],
            5: [ // 金曜日
                { p: 1, sub: "科学と人間生活", tea: "八木澤先生", start: "09:50", end: "10:40" },
                { p: 2, sub: "保健", tea: "新里先生", start: "10:50", end: "11:40" },
                { p: 3, sub: "地理総合", tea: "東先生", start: "11:50", end: "12:40" },
                { p: 4, sub: "言語文化", tea: "小川先生", start: "12:50", end: "13:40" },
                { p: 5, sub: "工業情報数理", tea: "藤井先生・前場先生", start: "13:25", end: "14:15" },
                { p: 6, sub: "英語CI", tea: "向後先生", start: "14:25", end: "15:15" }
            ]
        };

        // --- 特12時間割データ (45分授業、4限まで) ---
        const specialScheduleData = {
            1: [ // 月曜日
                { p: 1, sub: "工業情報数理", tea: "藤井先生・前場先生", start: "09:50", end: "10:35" },
                { p: 2, sub: "数学I", tea: "遠藤先生", start: "10:45", end: "11:30" },
                { p: 3, sub: "音楽I", tea: "川久保先生", start: "11:40", end: "12:25" },
                { p: 4, sub: "音楽I", tea: "川久保先生", start: "12:35", end: "13:20" }
            ],
            2: [ // 火曜日
                { p: 1, sub: "工業技術基礎", tea: "早川先生・前場先生・吉垣先生", start: "09:50", end: "10:35" },
                { p: 2, sub: "工業技術基礎", tea: "早川先生・前場先生・吉垣先生", start: "10:45", end: "11:30" },
                { p: 3, sub: "工業技術基礎", tea: "早川先生・前場先生・吉垣先生", start: "11:40", end: "12:25" },
                { p: 4, sub: "機械工作", tea: "森田先生", start: "12:35", end: "13:20" }
            ],
            3: [ // 水曜日
                { p: 1, sub: "地理総合", tea: "東先生", start: "09:50", end: "10:35" },
                { p: 2, sub: "体育", tea: "大崎先生", start: "10:45", end: "11:30" },
                { p: 3, sub: "生産技術", tea: "齊藤先生", start: "11:40", end: "12:25" },
                { p: 4, sub: "英語CI", tea: "向後先生", start: "12:35", end: "13:20" }
            ],
            4: [ // 木曜日
                { p: 1, sub: "体育", tea: "大崎先生", start: "09:50", end: "10:35" },
                { p: 2, sub: "生産技術", tea: "齊藤先生", start: "10:45", end: "11:30" },
                { p: 3, sub: "英語CI", tea: "向後先生", start: "11:40", end: "12:25" },
                { p: 4, sub: "科学と人間生活", tea: "八木澤先生", start: "12:35", end: "13:20" }
            ],
            5: [ // 金曜日
                { p: 1, sub: "科学と人間生活", tea: "八木澤先生", start: "09:50", end: "10:35" },
                { p: 2, sub: "保健", tea: "新里先生", start: "10:45", end: "11:30" },
                { p: 3, sub: "地理総合", tea: "東先生", start: "11:40", end: "12:25" },
                { p: 4, sub: "言語文化", tea: "小川先生", start: "12:35", end: "13:20" }
            ]
        };

        // --- 状態管理 ---
        let isSpecialSchedule = false;
        let currentSubject = "";
        let currentPeriod = 0;
        let hasNotified = false;
        let lastRenderedDay = -1;
        let lastRenderedSpecial = false;

        // --- DOM要素の取得 ---
        const timeEl = document.getElementById('current-time');
        const dateEl = document.getElementById('current-date');
        const currentSubjectEl = document.getElementById('current-subject');
        const currentTeacherEl = document.getElementById('current-teacher');
        const currentPeriodEl = document.getElementById('current-period');
        const currentTimeRangeEl = document.getElementById('current-time-range');
        
        const nextSubjectEl = document.getElementById('next-subject');
        const nextTeacherEl = document.getElementById('next-teacher');
        const nextPeriodEl = document.getElementById('next-period');
        const nextTimeRangeEl = document.getElementById('next-time-range');

        const scheduleListEl = document.getElementById('schedule-list');
        const toastEl = document.getElementById('toast');
        const toastMessageEl = document.getElementById('toast-message');
        const toggleEl = document.getElementById('schedule-toggle');

        // --- ユーティリティ関数 ---
        function timeToMinutes(timeStr) {
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        }

        function getCurrentTimeStr() {
            const now = new Date();
            return `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        }

        function showToast(message) {
            toastMessageEl.textContent = message;
            toastEl.classList.add('show');
            setTimeout(() => {
                toastEl.classList.remove('show');
            }, 5000);
        }

        // --- トグルイベント ---
        toggleEl.addEventListener('change', (e) => {
            isSpecialSchedule = e.target.checked;
            lastRenderedDay = -1; // 再描画を強制
            updateTimetable();
        });

        // --- 全体スケジュールの描画 ---
        function renderFullSchedule(schedule, currentP) {
            scheduleListEl.innerHTML = '';
            
            schedule.forEach(cls => {
                const item = document.createElement('div');
                item.className = `schedule-item ${cls.p === currentP ? 'current' : ''}`;
                item.id = `period-${cls.p}`;
                
                item.innerHTML = `
                    <div class="item-left">
                        <div class="item-subject">${cls.sub}</div>
                        <div class="item-teacher">${cls.tea}</div>
                    </div>
                    <div class="item-right">
                        <div class="item-period">${cls.p}限</div>
                        <div>${cls.start} ~ ${cls.end}</div>
                    </div>
                `;
                scheduleListEl.appendChild(item);
            });

            // 現在の授業の位置までスクロール
            const currentItem = document.getElementById(`period-${currentP}`);
            if (currentItem) {
                setTimeout(() => {
                    currentItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 100);
            }
        }

        // --- メインロジック ---
        function updateTimetable() {
            const now = new Date();
            const dayOfWeek = now.getDay();
            const currentTimeStr = getCurrentTimeStr();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();

            timeEl.textContent = currentTimeStr;

            if (dayOfWeek === 0 || dayOfWeek === 6) {
                dateEl.textContent = "今日は休日です";
                currentSubjectEl.textContent = "おやすみ";
                currentTeacherEl.textContent = "";
                currentPeriodEl.textContent = "";
                currentTimeRangeEl.textContent = "";
                nextSubjectEl.textContent = "おやすみ";
                nextTeacherEl.textContent = "";
                nextPeriodEl.textContent = "";
                nextTimeRangeEl.textContent = "";
                scheduleListEl.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-sub);">休日です</div>';
                return;
            }

            const dataSource = isSpecialSchedule ? specialScheduleData : normalScheduleData;
            const todaySchedule = dataSource[dayOfWeek];
            
            dateEl.textContent = `令和8年度 機械科1年2組 (${['日','月','火','水','木','金','土'][dayOfWeek]}曜日) ${isSpecialSchedule ? '【特12】' : ''}`;

            if (!todaySchedule) return;

            let currentClass = null;
            let nextClass = null;

            for (let i = 0; i < todaySchedule.length; i++) {
                const cls = todaySchedule[i];
                const startM = timeToMinutes(cls.start);
                const endM = timeToMinutes(cls.end);

                if (currentMinutes >= startM && currentMinutes < endM) {
                    currentClass = cls;
                    if (i + 1 < todaySchedule.length) {
                        nextClass = todaySchedule[i + 1];
                    }
                } else if (currentMinutes < startM) {
                    if (!nextClass && !currentClass) {
                        nextClass = cls;
                    }
                }
            }

            // 全日程終了後の処理
            if (!currentClass && !nextClass && currentMinutes > timeToMinutes(todaySchedule[todaySchedule.length - 1].end)) {
                currentSubjectEl.textContent = "今日の授業は終了しました";
                currentTeacherEl.textContent = "お疲れ様でした";
                currentPeriodEl.textContent = "";
                currentTimeRangeEl.textContent = "";
                
                let nextDay = dayOfWeek + 1;
                if (nextDay > 5) nextDay = 1;
                const nextDaySchedule = dataSource[nextDay];
                if (nextDaySchedule && nextDaySchedule.length > 0) {
                    const firstClass = nextDaySchedule[0];
                    nextSubjectEl.textContent = firstClass.sub;
                    nextTeacherEl.textContent = firstClass.tea;
                    nextPeriodEl.textContent = `${firstClass.p}限`;
                    nextTimeRangeEl.textContent = `${firstClass.start} ~ ${firstClass.end}`;
                }
                
                renderFullSchedule(todaySchedule, -1);
                return;
            }

            updateCardContent(currentClass, nextClass);
            renderFullSchedule(todaySchedule, currentClass ? currentClass.p : 0);

            // 通知ロジック
            if (nextClass) {
                const nextStartM = timeToMinutes(nextClass.start);
                const timeUntilNext = nextStartM - currentMinutes;

                if (timeUntilNext > 0 && timeUntilNext <= 5 && !hasNotified) {
                    showToast(`まもなく ${nextClass.p}限 「${nextClass.sub}」 が始まります。`);
                    hasNotified = true;
                }
            }
            
            if (currentClass && currentClass.sub !== currentSubject) {
                currentSubject = currentClass.sub;
                hasNotified = false;
            }
        }

        function updateCardContent(currentClass, nextClass) {
            const currentCard = document.getElementById('current-card');
            const nextCard = document.getElementById('next-card');

            if (currentClass) {
                if (currentSubjectEl.textContent !== currentClass.sub) {
                    currentCard.classList.add('fade-out');
                    setTimeout(() => {
                        currentSubjectEl.textContent = currentClass.sub;
                        currentTeacherEl.textContent = currentClass.tea;
                        currentPeriodEl.textContent = `${currentClass.p}限`;
                        currentTimeRangeEl.textContent = `${currentClass.start} ~ ${currentClass.end}`;
                        currentCard.classList.remove('fade-out');
                    }, 300);
                } else {
                    currentTimeRangeEl.textContent = `${currentClass.start} ~ ${currentClass.end}`;
                }
            } else {
                currentSubjectEl.textContent = "休憩時間";
                currentTeacherEl.textContent = "次の授業に備えましょう";
                currentPeriodEl.textContent = "";
                currentTimeRangeEl.textContent = "";
            }

            if (nextClass) {
                if (nextSubjectEl.textContent !== nextClass.sub) {
                    nextCard.classList.add('fade-out');
                    setTimeout(() => {
                        nextSubjectEl.textContent = nextClass.sub;
                        nextTeacherEl.textContent = nextClass.tea;
                        nextPeriodEl.textContent = `${nextClass.p}限`;
                        nextTimeRangeEl.textContent = `${nextClass.start} ~ ${nextClass.end}`;
                        nextCard.classList.remove('fade-out');
                    }, 300);
                }
            }
        }

        // --- 初期化と定期実行 ---
        updateTimetable();
        setInterval(updateTimetable, 1000);

        // --- PWA Service Workerの登録 ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful');
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>
</html>
